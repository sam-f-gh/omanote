name: Test

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    # The app ships as an Arch package built against Arch's Qt, so it's tested there.
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git for the checkout
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4

      - name: Install the package's dependencies
        # The recipe in omarchy-pkgs is the one list of what the app needs. Until
        # it has landed there, fall back to the local recipe in pkgbuild/.
        run: |
          if curl -fsSL "https://raw.githubusercontent.com/omacom/omarchy-pkgs/master/pkgbuilds/${{ github.event.repository.name }}/PKGBUILD" -o "$RUNNER_TEMP/PKGBUILD"; then
            source "$RUNNER_TEMP/PKGBUILD"
          else
            startdir="$PWD/pkgbuild" source pkgbuild/PKGBUILD
          fi
          deps=("${depends[@]}" "${makedepends[@]}" "${checkdepends[@]}")
          pacman -S --noconfirm --needed base-devel dbus "${deps[@]%%[<>=]*}"

      - name: Set up a user and a locale like a desktop's
        # Root can read any file, so tests about unreadable ones need an ordinary user; and the container generates no locale.
        run: |
          useradd -m tester
          chown -R tester .
          sed -i 's/^#en_US.UTF-8/en_US.UTF-8/' /etc/locale.gen
          locale-gen

      - name: Build
        run: su tester -c bin/build

      - name: Test
        run: su tester -c 'LANG=en_US.UTF-8 dbus-run-session -- bin/test'
